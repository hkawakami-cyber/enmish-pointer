<style>
/* ============================================================
   Enmish Pointer — プロトタイプ スタイル
   画面共有支援アプリ（カーソル強調・注釈・スポットライト・ズーム）
   ============================================================ */

:root {
  /* ===== Enmish ブランドトークン（資料デザインガイドライン v1.0 準拠） ===== */
  --ef-green: #6cbba5;        /* エンミッシュグリーン（ブランドカラー） */
  --ef-green-light: #8df1d5;
  --ef-green-pale: #cffaec;
  --ef-green-mid: #52907f;
  --ef-green-dark: #31594e;
  --ef-ink: #032841;          /* エンミッシュブラック（文字色） */
  --ef-gold: #917d44;         /* 注記・強調 */
  --ef-gold-light: #fbfaf7;
  --ef-rose: #c1677f;         /* 警告・注意 */
  --ef-rose-light: #f3e1e5;
  --ef-gray: #f5f7fa;         /* ストライプ／本文エリア */
  --ef-label-gray: #e8edf2;
  --ef-muted: #5b6478;

  /* 旧名のエイリアス（既存コードの参照を壊さないため） */
  --ef-blue: var(--ef-green);
  --ef-red: var(--ef-rose);
  --ef-amber: var(--ef-gold);

  --tb-bg: rgba(3, 40, 65, 0.94);   /* エンミッシュブラック基調のツールバー */
  --tb-fg: #f4f8f7;
  --tb-muted: #9fc6bb;

  --font-jp: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  --font-en: "Helvetica Neue", Helvetica, Arial, sans-serif;

  --radius: 12px;
  --shadow: 0 10px 30px rgba(3, 40, 65, 0.22);
  font-synthesis: none;
}

* { box-sizing: border-box; }

/* hidden 属性は常に最優先で非表示（.modal 等の display 指定に負けないように） */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #0c0f16;
  color: var(--ef-ink);
  font-family: var(--font-en), var(--font-jp);
  -webkit-font-smoothing: antialiased;
}

/* ============ ステージ（疑似共有画面） ============ */
.stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  /* 注釈ドラッグ中に共有画面のテキストが選択されないように */
  user-select: none;
  -webkit-user-select: none;
}

.zoomable {
  position: absolute;
  inset: 0;
  transform-origin: 50% 50%;
  transition: transform 90ms ease-out;
  will-change: transform;
}

.scene-root {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 64px 96px;
  background:
    radial-gradient(1100px 640px at 72% -12%, rgba(108, 187, 165, 0.22) 0%, transparent 58%),
    linear-gradient(160deg, #052f49 0%, #032841 100%);
}

.annot-canvas,
.overlay-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* 注釈中はステージがイベントを拾う（カーソル/描画用） */
.stage.armed { cursor: crosshair; }
.stage.tool-cursor { cursor: none; }

/* ============ 疑似共有画面：共通カード ============ */
.surface {
  width: min(1000px, 92%);
  background: #ffffff;
  border-radius: 14px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  overflow: hidden;
  color: var(--ef-ink);
}
.surface-bar {
  height: 38px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  background: #eef1f6;
  border-bottom: 1px solid #dce1ea;
  font-size: 12.5px;
  color: #5b6478;
}
.dot { width: 11px; height: 11px; border-radius: 50%; }
.dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
.surface-url { margin-left: 10px; background:#fff; border:1px solid #dce1ea; border-radius:7px; padding:3px 10px; }

/* ---- 提案資料スライド（Enmishトンマナ） ---- */
.slide { padding: 40px 54px 46px; }
.slide-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
.slide-head .ef-logo { display: inline-flex; align-items: center; gap: 9px; }
.slide-head .ef-logo b { font-family: var(--font-en); font-size: 24px; font-weight: 700; letter-spacing: -.01em; color: var(--ef-ink); }
.slide-head .doc-tag { font-size: 12px; color: var(--ef-muted); letter-spacing: .04em; }
.slide .eyebrow { color: var(--ef-green); font-weight: 700; letter-spacing: .12em; font-size: 13px; }
.slide h1 {
  font-size: 32px; margin: 8px 0 10px; line-height: 1.3; color: var(--ef-ink);
  display: inline-block; padding-bottom: 8px; border-bottom: 4px solid var(--ef-green);
}
.slide ul { font-size: 17px; line-height: 1.95; color: var(--ef-ink); padding-left: 22px; margin-top: 16px; }
.slide ul li::marker { color: var(--ef-green); }
.price-box { margin-top: 26px; display: flex; gap: 18px; flex-wrap: wrap; }
.price-card {
  flex: 1 1 200px; border: 1.5px solid var(--ef-label-gray); border-radius: 12px; padding: 18px 20px;
  background: #fff;
}
.price-card .pc-name { font-size: 13px; color: var(--ef-muted); }
.price-card .pc-amt { font-size: 28px; font-weight: 800; margin-top: 6px; color: var(--ef-ink); }
.price-card.feature { border-color: var(--ef-green); background: var(--ef-green-pale); }
.price-card.feature .pc-amt { color: var(--ef-green-dark); }

/* ---- KPI スプレッドシート ---- */
.sheet { padding: 0; }
.sheet table { width: 100%; border-collapse: collapse; font-size: 15px; }
.sheet th, .sheet td { padding: 11px 14px; border: 1px solid #e6e9f0; text-align: right; }
.sheet th { background: #f5f7fb; color: #5b6478; font-weight: 600; }
.sheet td:first-child, .sheet th:first-child { text-align: left; }
.sheet tr:nth-child(even) td { background: #fafbfe; }
.sheet .bad { color: var(--ef-red); font-weight: 700; }
.sheet .good { color: var(--ef-green); font-weight: 700; }

/* ---- Salesforce風 商談 ---- */
.sf { padding: 0; }
.sf-top { background: linear-gradient(90deg,#0b5cab,#1278d4); color:#fff; padding: 16px 24px; }
.sf-top .sf-kicker { font-size: 12.5px; opacity: .85; }
.sf-top h2 { margin: 4px 0 0; font-size: 24px; }
.sf-stage { display: flex; gap: 4px; padding: 16px 24px; background: #f3f6fb; }
.sf-step { flex:1; text-align:center; font-size:12px; padding:9px 4px; background:#e3eaf4; color:#5b6478; clip-path: polygon(0 0, 92% 0, 100% 50%, 92% 100%, 0 100%, 8% 50%); }
.sf-step.done { background:#1278d4; color:#fff; }
.sf-step.curr { background:#0b3d91; color:#fff; font-weight:700; }
.sf-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 8px 24px 22px; }
.sf-field { padding: 12px 0; border-bottom: 1px solid #eef1f6; }
.sf-field .k { font-size: 12px; color: #8a93a7; }
.sf-field .v { font-size: 16px; margin-top: 3px; font-weight: 600; }

/* ============ ツールバー ============ */
.toolbar {
  position: fixed;
  top: 50%;
  right: 0;
  transform: translateY(-50%);
  background: transparent;
  color: #fff;
  border-radius: 14px 0 0 14px;
  box-shadow: none;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  padding: 8px 6px;
  z-index: 9000;
  border: 1px solid rgba(176,184,196,.45);
  border-right: none;
  max-height: calc(100vh - 168px);
  overflow-y: auto;
  overflow-x: hidden;
  transition: transform .25s ease, opacity .25s ease;
}
.toolbar::-webkit-scrollbar { width: 0; }
/* ツールバーを左端に配置 */
.toolbar.side-left { right: auto; left: 0; border-radius: 0 14px 14px 0; border-right: 1px solid rgba(176,184,196,.45); border-left: none; }
/* アプリON中は共有画面を寄せ、端のツールバーと被らないようにする */
body.ef-on .scene-root { padding-right: 116px; transition: padding-right .25s ease, padding-left .25s ease; }
body.ef-on.bar-left .scene-root { padding-right: 0; padding-left: 116px; }
.toolbar[data-collapsed="true"] .tb-body { display: none; }
.toolbar[data-collapsed="true"] { padding: 6px; }

/* 自動フィット：ウィンドウに収まらない時はラベルを隠してアイコンのみ（コンパクト） */
.toolbar.compact .tb-body { width: 46px; gap: 1px; }
.toolbar.compact .tool { padding: 7px 3px; }
.toolbar.compact .tool .lbl { display: none; }
.toolbar.compact .tb-brand .ef-word, .toolbar.compact .tb-brand .ef-tag { display: none; }
.toolbar.compact .tb-colors { grid-template-columns: repeat(2, 1fr); }
.toolbar.compact .tb-sep { margin: 3px 4px; }
.tb-handle {
  display: none;
  width: 32px; height: 32px; border-radius: 9px;
  border: none; background: rgba(255,255,255,.08); color: var(--tb-fg);
  font-size: 18px; cursor: pointer;
}
.toolbar[data-collapsed="true"] .tb-handle { display: block; }

.tb-body { display: flex; flex-direction: column; gap: 3px; width: 78px; }
.tb-brand { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 2px 0 7px; }
.tb-brand .ef-mark {
  width: 22px; height: 22px; border-radius: 50%; background: var(--ef-green);
  position: relative; flex: none;
}
.tb-brand .ef-mark::after {
  content: ""; position: absolute; right: 4px; top: 4px; width: 6px; height: 6px;
  border-radius: 50%; background: var(--ef-ink);
}
.tb-brand .ef-word { font-family: var(--font-en); font-size: 13px; font-weight: 700; letter-spacing: -.01em; color: var(--tb-fg); line-height: 1; }
.tb-brand .ef-tag { font-size: 8.5px; letter-spacing: .18em; color: var(--ef-green); font-weight: 600; }
.tb-sep { height: 1px; background: rgba(150,160,175,.5); margin: 5px 4px; }

.tool {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  border: none; background: transparent; color: var(--tb-fg);
  padding: 7px 4px; border-radius: 9px; cursor: pointer;
  font-size: 10.5px; line-height: 1; transition: background .12s, transform .08s;
}
.tool:hover { background: rgba(255,255,255,.18); }
.tool:active { transform: scale(.94); }
/* 透明な帯の上でも、明るい/暗いどちらの背景でも読めるよう白＋濃い影 */
.tool .ico { font-size: 17px; display: inline-flex; align-items: center; justify-content: center; height: 20px; color: #fff; filter: drop-shadow(0 0 1px rgba(0,0,0,.7)) drop-shadow(0 1px 1.5px rgba(0,0,0,.85)); }
.ico svg { display: block; }
.dock-btn .ico svg { display: block; }
.tool .lbl { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.95); }
.tool.active { background: var(--ef-blue); }
.tool.active .ico { filter: none; }
.tool.active .lbl { color: #fff; text-shadow: none; }
.tool.toggled { background: rgba(47,107,255,.28); outline: 1.5px solid var(--ef-blue); }
.tool.recording { background: rgba(193,103,127,.30); outline: 1.5px solid var(--ef-rose, #c1677f); }
.tool.recording .ico { color: var(--ef-rose, #c1677f); }
.tool.recording .lbl { color: var(--ef-rose, #c1677f); }

.tb-colors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 2px; }
.swatch { width: 15px; height: 15px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
.swatch.active { border-color: #fff; box-shadow: 0 0 0 1.5px rgba(0,0,0,.4); }

/* アプリOFF時はツール群を無効化 */
/* 未起動でもツールは押せる（押すと自動的に起動して選択される）。視覚的にだけ少し淡く。 */
.toolbar.app-off .tool[data-tool],
.toolbar.app-off .tool[data-toggle],
.toolbar.app-off .tb-colors { opacity: .7; }

/* ツール群コンテナ（ツールバー内） */
.tb-tools { display: flex; flex-direction: column; gap: 3px; }

/* ============ 設定：ツールバー編集 ============ */
.set-tools { display: flex; flex-direction: column; gap: 6px; }
.set-tool-row {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid #eef1f6; border-radius: 9px; background: #fafbfe;
  padding: 4px 10px 4px 6px; transition: border-color .12s, background .12s, opacity .12s;
}
.set-tool-row.dragging { opacity: .45; }
.set-tool-row.drag-over { border-color: var(--ef-green); background: var(--ef-green-pale); }
.st-grip {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 28px; color: var(--ef-muted); cursor: grab; flex: none;
}
.st-grip:active { cursor: grabbing; }
.st-grip svg { display: block; }
.st-label {
  display: flex; align-items: center; gap: 8px; flex: 1;
  font-size: 13.5px; color: #2c3550; cursor: pointer;
}
.st-label input { accent-color: var(--ef-green); }
/* カスタムチェックボックス：緑ボックス＋白いチェック */
.st-label input[type="checkbox"],
.checkfield input[type="checkbox"] {
  appearance: none; -webkit-appearance: none; margin: 0;
  width: 18px; height: 18px; flex: none; border: 1.5px solid var(--ef-green);
  border-radius: 5px; background: #fff; cursor: pointer; position: relative;
}
.st-label input[type="checkbox"]:checked,
.checkfield input[type="checkbox"]:checked {
  background: var(--ef-green); border-color: var(--ef-green);
}
.st-label input[type="checkbox"]:checked::after,
.checkfield input[type="checkbox"]:checked::after {
  content: ""; position: absolute; left: 5px; top: 1.5px;
  width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.st-ico { display: inline-flex; align-items: center; color: var(--ef-green-dark); }
.st-ico svg { display: block; }

/* ============ 営業テンプレ / KPIマーカー バー ============ */
.stamp-bar {
  position: fixed; left: 14px; top: 50%; transform: translateY(-50%);
  background: var(--tb-bg); color: var(--tb-fg);
  border-radius: 14px; box-shadow: var(--shadow); backdrop-filter: blur(14px);
  padding: 30px 12px 12px; z-index: 9000; width: 150px;
  border: 1px solid rgba(255,255,255,.08);
  transition: opacity .25s, transform .25s;
}
.stamp-bar.collapsed { display: none !important; }
.sb-hide {
  position: absolute; top: 7px; right: 7px; width: 22px; height: 22px;
  border: none; border-radius: 6px; background: rgba(255,255,255,.10);
  color: var(--tb-fg); cursor: pointer; font-size: 11px; line-height: 1;
}
.sb-hide:hover { background: rgba(255,255,255,.22); }
.sb-reopen {
  position: fixed; left: 0; top: 50%; transform: translateY(-50%);
  writing-mode: vertical-rl; background: var(--tb-bg); color: var(--tb-fg);
  border: 1px solid rgba(255,255,255,.08); border-left: none;
  border-radius: 0 11px 11px 0; padding: 16px 7px; cursor: pointer;
  z-index: 9000; font-size: 12px; box-shadow: var(--shadow);
  letter-spacing: .05em;
}
.sb-reopen:hover { background: rgba(255,255,255,.14); }
.stamp-bar-title { font-size: 11px; color: var(--tb-muted); margin: 4px 2px 6px; letter-spacing: .04em; }
.stamp-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.chip {
  font-size: 11.5px; padding: 4px 9px; border-radius: 999px; cursor: pointer;
  border: 1px solid rgba(255,255,255,.18); color: #fff; font-weight: 600; line-height: 1.3;
  transition: transform .08s, filter .12s;
}
.chip:hover { filter: brightness(1.12); }
.chip:active { transform: scale(.93); }
.chip.armed { outline: 2px solid #fff; }

.stamp-bar.hidden-off { opacity: .3; pointer-events: none; }

/* ============ シーン切替 ============ */
.scene-switch {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  background: var(--tb-bg); color: var(--tb-fg); padding: 7px 10px;
  border-radius: 999px; box-shadow: var(--shadow); z-index: 9000;
  display: flex; align-items: center; gap: 6px; font-size: 13px;
  border: 1px solid rgba(255,255,255,.08);
}
.ss-label { color: var(--tb-muted); padding: 0 4px; }
.ss-btn {
  border: none; background: rgba(255,255,255,.08); color: var(--tb-fg);
  padding: 6px 13px; border-radius: 999px; cursor: pointer; font-size: 13px;
}
.ss-btn:hover { background: rgba(255,255,255,.16); }
.ss-btn.active { background: var(--ef-blue); }

/* ============ ツール別オプション・フライアウト ============ */
.tool-options {
  position: fixed; right: 100px; top: 50%; transform: translateY(-50%);
  background: var(--tb-bg); color: var(--tb-fg); border-radius: 14px;
  padding: 12px; box-shadow: var(--shadow); z-index: 8900; width: 168px;
  border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(14px);
  display: flex; flex-direction: column; gap: 12px;
}
.to-group { display: flex; flex-direction: column; gap: 6px; }
.to-title { font-size: 11px; color: var(--tb-muted); letter-spacing: .03em; }
.to-btns { display: flex; flex-wrap: wrap; gap: 5px; }
.to-btn {
  display: inline-flex; align-items: center; gap: 4px; border: 1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.05); color: var(--tb-fg); border-radius: 8px;
  padding: 5px 9px; font-size: 11.5px; cursor: pointer; line-height: 1;
}
.to-btn:hover { background: rgba(255,255,255,.12); }
.to-btn.on { background: var(--ef-green); border-color: var(--ef-green); color: #06251c; font-weight: 700; }
.to-btn .to-ico { font-size: 13px; }

/* インラインのテキスト入力欄 */
.ef-text-input {
  position: absolute; transform: translateY(-4px); z-index: 8100;
  border: none; border-bottom: 2px solid currentColor; background: rgba(255,255,255,.9);
  font-weight: 700; padding: 2px 6px; border-radius: 4px; min-width: 120px; outline: none;
  font-family: var(--font-en), var(--font-jp);
}

/* UI（ツールバー・サイドバー）の一時非表示。注釈・カーソルは残す */
body.ef-ui-hidden .toolbar,
body.ef-ui-hidden .stamp-bar,
body.ef-ui-hidden .sb-reopen,
body.ef-ui-hidden #tool-options,
body.ef-ui-hidden .scene-switch { display: none !important; }
body.ef-ui-hidden .scene-root { padding-right: 64px; }

.seg-wrap { display: flex; flex-wrap: wrap; margin-top: 8px; }

/* ============ カーソルリング ============ */
.cursor-ring {
  position: absolute; left: 0; top: 0; pointer-events: none; z-index: 8000;
  border-radius: 50%; transform: translate(-50%, -50%);
  border-style: solid; border-color: var(--ef-green);
}
.cursor-ring .cr-dot {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  border-radius: 50%; display: none;
}
.cursor-ring .cr-arrow {
  position: absolute; left: 0; top: 0; display: none; overflow: visible;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,.35));
}
.ripple {
  position: absolute; pointer-events: none; z-index: 7999;
  border-radius: 50%; transform: translate(-50%, -50%);
  border: 3px solid var(--ef-blue); animation: ripple .55s ease-out forwards;
}
@keyframes ripple {
  from { width: 8px; height: 8px; opacity: .85; }
  to   { width: 90px; height: 90px; opacity: 0; }
}

/* ============ ズーム枠 ============ */
.zoom-frame {
  position: absolute; pointer-events: none; z-index: 7000;
  border: 2.5px solid rgba(255,255,255,.85);
  box-shadow: 0 0 0 9999px rgba(0,0,0,.001), 0 8px 24px rgba(0,0,0,.4);
  border-radius: 12px; transform: translate(-50%, -50%);
}

/* ============ スタンプ配置ヒント ============ */
.stamp-hint {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--ef-blue); color: #fff; padding: 9px 18px;
  border-radius: 999px; font-size: 13px; z-index: 9500; box-shadow: var(--shadow);
}

/* ============ クイックパレット ============ */
.quick-palette {
  position: fixed; inset: 0; z-index: 9600;
  display: flex; align-items: center; justify-content: center;
  background: rgba(10,12,18,.45); backdrop-filter: blur(3px);
}
.qp-card {
  background: var(--tb-bg); color: var(--tb-fg); border-radius: 18px;
  padding: 22px 26px; box-shadow: var(--shadow); width: 360px;
  border: 1px solid rgba(255,255,255,.10);
}
.qp-title { text-align: center; font-size: 14px; color: var(--tb-muted); margin-bottom: 16px; }
.qp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.qp-item {
  display: flex; align-items: center; gap: 10px; padding: 11px 14px;
  border: none; background: rgba(255,255,255,.07); color: var(--tb-fg);
  border-radius: 11px; cursor: pointer; font-size: 14px; text-align: left;
}
.qp-item:hover { background: var(--ef-blue); }
.qp-item kbd {
  background: rgba(255,255,255,.16); border-radius: 6px; padding: 2px 8px;
  font-size: 13px; min-width: 22px; text-align: center;
}
.qp-hint { text-align: center; color: var(--tb-muted); font-size: 12px; margin-top: 14px; }

/* ============ ホワイトボード ============ */
.whiteboard {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(820px, 86vw); height: min(540px, 74vh);
  background: #fff; border-radius: 16px; box-shadow: var(--shadow);
  z-index: 9200; display: flex; flex-direction: column; overflow: hidden;
  border: 1px solid rgba(0,0,0,.1);
}
.wb-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 14px; background: #1b2130; color: #fff;
}
.wb-title { font-size: 14px; font-weight: 600; }
.wb-tools { display: flex; gap: 5px; align-items: center; }
.wb-tool {
  width: 32px; height: 32px; border-radius: 8px; border: none;
  background: rgba(255,255,255,.10); color: #fff; cursor: pointer; font-size: 15px;
}
.wb-tool:hover { background: rgba(255,255,255,.22); }
.wb-tool.active { background: var(--ef-blue); }
.wb-spacer { width: 10px; }
.wb-canvas { flex: 1; width: 100%; cursor: crosshair; background: #fff; }
.whiteboard[data-bg="dark"] .wb-canvas { background: #11151f; }

/* ============ 設定モーダル ============ */
.modal {
  position: fixed; inset: 0; z-index: 9700; display: flex;
  align-items: center; justify-content: center;
  background: rgba(10,12,18,.5); backdrop-filter: blur(3px);
}
.modal-card {
  background: #fff; color: var(--ef-ink); width: min(540px, 92vw);
  max-height: 88vh; overflow-y: auto; border-radius: 18px; box-shadow: var(--shadow);
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 24px; border-bottom: 1px solid #eef1f6; position: sticky; top: 0; background: #fff;
}
.modal-head h2 { margin: 0; font-size: 19px; }
.modal-close { border: none; background: #f0f2f7; width: 32px; height: 32px; border-radius: 9px; cursor: pointer; font-size: 15px; }
.modal-section { padding: 18px 24px; border-bottom: 1px solid #f3f5f9; }
.modal-section h3 { margin: 0 0 12px; font-size: 14px; color: #5b6478; }
.field { display: flex; align-items: center; gap: 12px; font-size: 13.5px; margin-bottom: 12px; color: #2c3550; }
.field input[type="range"] { flex: 1; accent-color: var(--ef-green); }
.checkfield input { accent-color: var(--ef-green); }
.field output { min-width: 42px; text-align: right; color: #5b6478; font-variant-numeric: tabular-nums; }
.checkfield { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: #2c3550; }

/* カラーパレット編集 */
.palette-edit { display: flex; flex-wrap: wrap; gap: 8px; }
.pal-color {
  width: 34px; height: 34px; padding: 0; border: 1px solid #dfe3ec; border-radius: 9px;
  background: none; cursor: pointer;
}
.pal-color::-webkit-color-swatch-wrapper { padding: 2px; }
.pal-color::-webkit-color-swatch { border: none; border-radius: 6px; }
/* 設定モーダル内のカラー行（テキスト色） */
.palette-row { display: flex; flex-wrap: wrap; gap: 6px; }
.palette-row .swatch { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
.palette-row .swatch.active { border-color: var(--ef-ink); box-shadow: 0 0 0 1.5px #fff inset; }

.preset-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.preset {
  text-align: left; border: 1.5px solid #e3e7f0; border-radius: 12px; padding: 12px 14px;
  background: #fff; cursor: pointer; transition: border-color .12s, background .12s;
}
.preset:hover { border-color: var(--ef-blue); }
.preset.active { border-color: var(--ef-green); background: var(--ef-green-pale); }
.preset .p-name { font-weight: 700; font-size: 14px; }
.preset .p-desc { font-size: 11.5px; color: #6b7488; margin-top: 3px; line-height: 1.5; }

.seg { display: inline-flex; border: 1px solid #dfe3ec; border-radius: 10px; overflow: hidden; }
.seg button { border: none; background: #fff; padding: 8px 16px; cursor: pointer; font-size: 13px; color: #2c3550; }
.seg button + button { border-left: 1px solid #dfe3ec; }
.seg button.active { background: var(--ef-blue); color: #fff; }

.shortcut-table { width: 100%; font-size: 13px; border-collapse: collapse; }
.shortcut-table td { padding: 6px 4px; border-bottom: 1px solid #f3f5f9; color: #2c3550; }
.shortcut-table td:last-child { text-align: right; }
.note { font-size: 11.5px; color: #8a93a7; line-height: 1.6; margin-top: 12px; }

kbd {
  font-family: inherit; background: #eef1f6; border: 1px solid #dce1ea;
  border-bottom-width: 2px; border-radius: 6px; padding: 1px 7px; font-size: 12px; color: #2c3550;
}

/* ============ 常駐ドック ============ */
.ef-dock.dock-bottom-right { left: auto; right: 16px; bottom: 16px; top: auto; }
.ef-dock.dock-top-left { top: 16px; left: 16px; bottom: auto; right: auto; }
.ef-dock.dock-top-right { top: 16px; right: 16px; bottom: auto; left: auto; }
.ef-dock {
  position: fixed; left: 16px; bottom: 16px; z-index: 9300;
  display: flex; gap: 6px; padding: 6px;
  background: var(--tb-bg); border: 1px solid rgba(255,255,255,.08);
  border-radius: 14px; box-shadow: var(--shadow); backdrop-filter: blur(14px);
}
.dock-btn {
  display: flex; align-items: center; gap: 6px; border: none; cursor: pointer;
  background: rgba(255,255,255,.06); color: var(--tb-fg);
  padding: 8px 12px; border-radius: 10px; font-size: 12px; line-height: 1;
}
.dock-btn:hover { background: rgba(255,255,255,.14); }
.dock-btn .ico { font-size: 15px; }
.dock-btn#dock-power.on { background: var(--ef-green); color: #06251c; font-weight: 700; }
.dock-btn#dock-bars.on { background: var(--ef-gold); color: #fff; font-weight: 700; }
.dock-btn.dim { opacity: .4; pointer-events: none; }

/* ============ ステータスバッジ / トースト ============ */
.status-badge {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--tb-bg); color: #fff; padding: 7px 16px; border-radius: 999px;
  font-size: 13px; z-index: 8500; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,.08);
}
.status-badge .dotc { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: middle; }

.toast {
  position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: #1b2130; color: #fff; padding: 11px 20px; border-radius: 12px;
  font-size: 13.5px; z-index: 9999; box-shadow: var(--shadow); opacity: 0;
  transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* レスポンシブ：狭い画面ではツールバーを横下に */
@media (max-width: 680px) {
  .stamp-bar { display: none; }
  .tb-body { width: 64px; }
}

<script>
/* ============================================================
   state.js — アプリ全体の状態と共有ヘルパー
   ============================================================ */
(function () {
  const EF = (window.EF = window.EF || {});

  // カラーパレット（Enmishブランド規定色のみ）
  // 波長順（長波長＝赤系 → 短波長＝青系、無彩色は末尾）
  EF.PALETTE = [
    { name: "rose", value: "#c1677f" },        // 赤系（長波長）
    { name: "gold", value: "#917d44" },        // 黄
    { name: "green-light", value: "#8df1d5" },
    { name: "green", value: "#6cbba5" },       // エンミッシュグリーン
    { name: "green-dark", value: "#31594e" },
    { name: "ink", value: "#032841" },         // 青（短波長）
    { name: "gray", value: "#5b6478" },
    { name: "white", value: "#ffffff" },       // 無彩色
  ];



  // 実行時状態
  EF.state = {
    appOn: false,        // アプリ起動状態
    tool: "cursor",      // 現在の注釈ツール: cursor|pen|highlighter|arrow|ellipse|rect|text
    color: "#6cbba5",
    strokeWidth: 6,
    textSize: 28,        // テキスト注釈の大きさ(px)
    textBold: true,      // テキスト注釈の太さ
    textColor: "#032841",// テキスト注釈の色
    ring: { width: 6, size: 64, opacity: 0.9, ripple: true },
    cursorStyle: "ring", // ring | dot | halo | ringdot | arrow
    arrowHead: "end",    // end | start | both
    showOptions: false,  // ツールオプションのフライアウトを画面に表示するか
    uiHidden: false,
    spotlight: false,
    spotShape: "band",   // band（横帯） | circle
    spotBand: 0.5,       // 帯の高さ（ビューポート比）
    spotDim: 0.72,       // スポットライトの暗さ（0〜1）
    zoom: false,
    zoomScale: 2.0,
    // ツールバーのカスタム（並べ替え・表示/非表示）
    toolOrder: ["rect", "highlighter", "arrow", "hline", "text", "pen", "cursor", "ellipse", "spotlight", "zoom"],
    toolHidden: {},
    // バーの配置
    barSide: "right",    // ツールバーの左右: right | left
    dockPos: "bottom-left", // ドック位置: bottom-left | bottom-right | top-left | top-right
    recording: false,
    mouse: { x: -999, y: -999, inStage: false },
  };

  // --- 共有ユーティリティ ---
  EF.toast = function (msg, ms) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.hidden = false;
    requestAnimationFrame(() => el.classList.add("show"));
    clearTimeout(EF._toastT);
    EF._toastT = setTimeout(() => {
      el.classList.remove("show");
      setTimeout(() => (el.hidden = true), 220);
    }, ms || 1600);
  };

  EF.setStatus = function () {
    const el = document.getElementById("status-badge");
    if (!EF.state.appOn) { el.hidden = true; return; }
    const names = {
      cursor: "カーソル強調", pen: "ペン", highlighter: "蛍光ペン",
      arrow: "矢印", hline: "横線", ellipse: "丸囲み", rect: "四角囲み", text: "テキスト",
    };
    const extras = [];
    if (EF.state.spotlight) extras.push("スポットライト");
    if (EF.state.zoom) extras.push(`ズーム×${EF.state.zoomScale.toFixed(1)}`);
    const label = names[EF.state.tool] || EF.state.tool;
    el.innerHTML = `<span class="dotc" style="background:${EF.state.color}"></span>` +
      label + (extras.length ? " ・ " + extras.join(" ・ ") : "");
    el.hidden = false;
  };

  // --- 設定の永続化（localStorage） ---
  const STORE_KEY = "enmishFocus.settings.v1";
  const PERSIST = ["color", "strokeWidth", "textSize", "textBold", "textColor", "ring", "cursorStyle", "arrowHead",
    "spotShape", "spotBand", "spotDim", "zoomScale", "showOptions", "toolOrder", "toolHidden", "barSide", "dockPos"];

  EF.saveSettings = function () {
    try {
      const obj = { palette: EF.PALETTE.map((c) => c.value) };
      PERSIST.forEach((k) => { obj[k] = EF.state[k]; });
      localStorage.setItem(STORE_KEY, JSON.stringify(obj));
    } catch (e) { /* sandbox等で不可なら黙ってスキップ */ }
  };

  EF.loadSettings = function () {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      const obj = JSON.parse(raw);
      if (Array.isArray(obj.palette)) {
        obj.palette.forEach((v, i) => { if (EF.PALETTE[i]) EF.PALETTE[i].value = v; });
      }
      PERSIST.forEach((k) => {
        if (obj[k] === undefined) return;
        if (k === "ring") EF.state.ring = Object.assign({}, EF.state.ring, obj.ring);
        else EF.state[k] = obj[k];
      });
    } catch (e) { /* noop */ }
  };

  EF.loadSettings(); // 起動時に保存済み設定を反映

  // ステージ座標へ正規化（mouseEvent → ステージ相対 px）
  EF.stagePoint = function (ev) {
    const stage = document.getElementById("stage");
    const r = stage.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  };

  // イベントバス（疎結合に各モジュールへ通知）
  const listeners = {};
  EF.on = function (ev, fn) { (listeners[ev] = listeners[ev] || []).push(fn); };
  EF.emit = function (ev, data) { (listeners[ev] || []).forEach((fn) => fn(data)); };
})();

</script>

<script>
/* ============================================================
   drawing.js — 注釈描画エンジン
   注釈レイヤーとミニホワイトボードの両方で使い回す。
   strokes 配列を保持し requestAnimationFrame で再描画。
   自動消去（フェードアウト）も担当する。
   ============================================================ */
(function () {
  const EF = (window.EF = window.EF || {});

  const FADE_MS = 600; // 自動消去時のフェード時間

  function DrawingEngine(canvas, opts) {
    opts = opts || {};
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.strokes = [];
    this.redo = [];
    this.current = null;
    this.dpr = window.devicePixelRatio || 1;
    this.getStyle = opts.getStyle || (() => ({ color: "#2f6bff", width: 6, tool: "pen" }));
    this.getAutoErase = opts.getAutoErase || (() => 0);
    this.resize();
    this._loop = this._loop.bind(this);
    requestAnimationFrame(this._loop);
  }

  DrawingEngine.prototype.resize = function () {
    const r = this.canvas.getBoundingClientRect();
    this.dpr = window.devicePixelRatio || 1;
    this.w = r.width; this.h = r.height;
    this.canvas.width = Math.max(1, Math.round(r.width * this.dpr));
    this.canvas.height = Math.max(1, Math.round(r.height * this.dpr));
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  };

  // --- ポインタ操作 ---
  DrawingEngine.prototype.start = function (x, y) {
    const s = this.getStyle();
    if (s.tool === "text") { return; } // テキストはインライン入力で別途処理
    this.current = {
      tool: s.tool, color: s.color, width: s.width, head: s.head || "end",
      points: [{ x, y }], a: { x, y }, b: { x, y },
    };
    this.redo.length = 0;
  };

  DrawingEngine.prototype.move = function (x, y) {
    if (!this.current) return;
    const c = this.current;
    // 横線・蛍光ペンはY固定（高さが変わらない＝水平に引く）
    if (c.tool === "hline" || c.tool === "highlighter") y = c.a.y;
    c.b = { x, y };
    if (c.tool === "pen" || c.tool === "highlighter") c.points.push({ x, y });
  };

  DrawingEngine.prototype.end = function () {
    if (!this.current) return;
    const c = this.current;
    // クリックだけ（移動なし）の図形は無視
    const moved = Math.hypot(c.b.x - c.a.x, c.b.y - c.a.y) > 3 || c.points.length > 2;
    if (moved) { c.born = performance.now(); this.strokes.push(c); }
    this.current = null;
  };

  DrawingEngine.prototype.addText = function (x, y, text, opts) {
    if (!text || !text.trim()) return;
    opts = opts || {};
    const s = {
      tool: "text", text: text.trim(), a: { x, y },
      color: opts.color || "#032841",
      size: opts.size || 28,
      weight: opts.weight || 700,
      born: performance.now(),
    };
    this.strokes.push(s);
    this.redo.length = 0;
    return s;
  };

  // クリック位置にあるテキスト注釈を返す（再編集用）。なければ null。
  DrawingEngine.prototype.hitText = function (x, y) {
    const ctx = this.ctx;
    for (let i = this.strokes.length - 1; i >= 0; i--) {
      const s = this.strokes[i];
      if (s.tool !== "text") continue;
      const fs = s.size || 28;
      ctx.font = `${s.weight || 700} ${fs}px -apple-system, "Hiragino Sans", sans-serif`;
      const tw = ctx.measureText(s.text).width, pad = 8;
      if (x >= s.a.x - pad && x <= s.a.x + tw + pad && y >= s.a.y - pad && y <= s.a.y + fs + pad) return s;
    }
    return null;
  };

  DrawingEngine.prototype.removeStroke = function (s) {
    const i = this.strokes.indexOf(s);
    if (i >= 0) this.strokes.splice(i, 1);
  };

  DrawingEngine.prototype.addStamp = function (x, y, label, color) {
    this.strokes.push({ tool: "stamp", label, color, a: { x, y }, born: performance.now() });
    this.redo.length = 0;
  };

  DrawingEngine.prototype.undo = function () {
    if (this.current) { this.current = null; return; }
    const s = this.strokes.pop();
    if (s) this.redo.push(s);
  };
  DrawingEngine.prototype.redoLast = function () {
    const s = this.redo.pop();
    if (s) this.strokes.push(s);
  };
  DrawingEngine.prototype.clear = function () {
    this.strokes.length = 0; this.current = null; this.redo.length = 0;
  };
  DrawingEngine.prototype.isEmpty = function () {
    return this.strokes.length === 0 && !this.current;
  };

  // --- 描画ループ ---
  DrawingEngine.prototype._loop = function () {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.w, this.h);
    const ae = this.getAutoErase();
    const now = performance.now();

    // 自動消去：寿命を過ぎたものはフェード→削除
    if (ae > 0) {
      const lifeMs = ae * 1000;
      this.strokes = this.strokes.filter((s) => now - s.born < lifeMs + FADE_MS);
    }

    for (const s of this.strokes) {
      if (s._editing) continue; // 再編集中のテキストは入力欄で表示するため描かない
      let alpha = 1;
      if (ae > 0) {
        const age = now - s.born;
        const lifeMs = ae * 1000;
        if (age > lifeMs) alpha = Math.max(0, 1 - (age - lifeMs) / FADE_MS);
      }
      this._drawStroke(ctx, s, alpha);
    }
    if (this.current) this._drawStroke(ctx, this.current, 1);

    requestAnimationFrame(this._loop);
  };

  DrawingEngine.prototype._drawStroke = function (ctx, s, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = s.color;
    ctx.fillStyle = s.color;
    ctx.lineWidth = s.width || 6;

    if (s.tool === "pen") {
      this._poly(ctx, s.points);
    } else if (s.tool === "highlighter") {
      ctx.globalAlpha = alpha * 0.35;
      ctx.lineWidth = (s.width || 6) * 3;
      this._poly(ctx, s.points);
    } else if (s.tool === "line" || s.tool === "hline") {
      ctx.beginPath(); ctx.moveTo(s.a.x, s.a.y); ctx.lineTo(s.b.x, s.b.y); ctx.stroke();
    } else if (s.tool === "arrow") {
      this._arrow(ctx, s.a, s.b, s.width || 6, s.head || "end");
    } else if (s.tool === "rect") {
      const x = Math.min(s.a.x, s.b.x), y = Math.min(s.a.y, s.b.y);
      this._roundRect(ctx, x, y, Math.abs(s.b.x - s.a.x), Math.abs(s.b.y - s.a.y), 8);
      ctx.stroke();
    } else if (s.tool === "ellipse") {
      const cx = (s.a.x + s.b.x) / 2, cy = (s.a.y + s.b.y) / 2;
      const rx = Math.abs(s.b.x - s.a.x) / 2, ry = Math.abs(s.b.y - s.a.y) / 2;
      ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
    } else if (s.tool === "text") {
      ctx.globalAlpha = alpha;
      const fs = s.size || 28;
      ctx.font = `${s.weight || 700} ${fs}px -apple-system, "Hiragino Sans", sans-serif`;
      ctx.textBaseline = "top";
      // 視認性のため白縁取り
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(255,255,255,.9)";
      ctx.strokeText(s.text, s.a.x, s.a.y);
      ctx.fillText(s.text, s.a.x, s.a.y);
    } else if (s.tool === "stamp") {
      this._stamp(ctx, s, alpha);
    }
    ctx.restore();
  };

  DrawingEngine.prototype._poly = function (ctx, pts) {
    if (!pts || pts.length < 2) {
      if (pts && pts.length === 1) { ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill(); }
      return;
    }
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i + 1].x) / 2;
      const my = (pts[i].y + pts[i + 1].y) / 2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
    ctx.stroke();
  };

  DrawingEngine.prototype._arrow = function (ctx, a, b, w, head) {
    const size = Math.max(16, w * 3.4);     // 矢じりの長さ
    const spread = Math.PI / 5.5;            // 矢じりの開き（広めで自然に）
    // 矢じりの根元までで線を止める（線が矢じりを突き抜けないように）
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    const back = size * 0.72;
    const ea = { x: a.x, y: a.y }, eb = { x: b.x, y: b.y };
    if (head === "end" || head === "both") { eb.x = b.x - back * Math.cos(ang); eb.y = b.y - back * Math.sin(ang); }
    if (head === "start" || head === "both") { ea.x = a.x + back * Math.cos(ang); ea.y = a.y + back * Math.sin(ang); }
    ctx.beginPath(); ctx.moveTo(ea.x, ea.y); ctx.lineTo(eb.x, eb.y); ctx.stroke();
    const drawHead = (tip, from) => {
      const an = Math.atan2(tip.y - from.y, tip.x - from.x);
      ctx.beginPath();
      ctx.moveTo(tip.x, tip.y);
      ctx.lineTo(tip.x - size * Math.cos(an - spread), tip.y - size * Math.sin(an - spread));
      ctx.lineTo(tip.x - size * Math.cos(an + spread), tip.y - size * Math.sin(an + spread));
      ctx.closePath(); ctx.fill();
    };
    if (head === "end" || head === "both") drawHead(b, a);
    if (head === "start" || head === "both") drawHead(a, b);
  };

  DrawingEngine.prototype._roundRect = function (ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };

  DrawingEngine.prototype._stamp = function (ctx, s, alpha) {
    const fs = 15;
    ctx.font = `700 ${fs}px -apple-system, "Hiragino Sans", sans-serif`;
    const padX = 11, padY = 7, th = fs + padY * 2;
    const tw = ctx.measureText(s.label).width + padX * 2;
    const x = s.a.x, y = s.a.y;
    // ピン形の吹き出し
    ctx.globalAlpha = alpha;
    ctx.fillStyle = s.color;
    this._roundRect(ctx, x, y, tw, th, 7);
    ctx.fill();
    // 下向きの三角ポインタ
    ctx.beginPath();
    ctx.moveTo(x + 14, y + th);
    ctx.lineTo(x + 26, y + th);
    ctx.lineTo(x + 14, y + th + 11);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.textBaseline = "middle";
    ctx.fillText(s.label, x + padX, y + th / 2 + 1);
  };

  EF.DrawingEngine = DrawingEngine;
})();

</script>
<script>
/* ============================================================
   cursor.js — カーソル強調（リング＋クリック波紋）
   ============================================================ */
(function () {
  const EF = (window.EF = window.EF || {});

  let ring;

  EF.cursor = {
    init() {
      ring = document.getElementById("cursor-ring");
      const stage = document.getElementById("stage");

      stage.addEventListener("mousemove", (ev) => {
        const p = EF.stagePoint(ev);
        EF.state.mouse = { x: p.x, y: p.y, inStage: true };
        this.update();
        EF.emit("mousemove", p);
      });
      stage.addEventListener("mouseleave", () => {
        EF.state.mouse.inStage = false;
        ring.hidden = true;
        EF.emit("mouseleave");
      });
      stage.addEventListener("mouseenter", () => {
        EF.state.mouse.inStage = true;
        this.update();
      });

      // クリック波紋（右/左で色を変える）
      stage.addEventListener("mousedown", (ev) => {
        if (!EF.state.appOn || !EF.state.ring.ripple) return;
        const p = EF.stagePoint(ev);
        const r = document.createElement("div");
        r.className = "ripple";
        r.style.left = p.x + "px";
        r.style.top = p.y + "px";
        r.style.borderColor = ev.button === 2 ? EF.PALETTE[1].value : EF.state.color;
        stage.appendChild(r);
        setTimeout(() => r.remove(), 600);
      });
      stage.addEventListener("contextmenu", (ev) => {
        if (EF.state.appOn) ev.preventDefault();
      });
    },

    update() {
      const on = EF.state.appOn && EF.state.mouse.inStage;
      if (!on) { ring.hidden = true; return; }
      const r = EF.state.ring, color = EF.state.color, style = EF.state.cursorStyle || "ring";
      const dot = ring.querySelector(".cr-dot");
      const arrow = ring.querySelector(".cr-arrow");
      ring.hidden = false;
      ring.style.width = r.size + "px";
      ring.style.height = r.size + "px";
      ring.style.left = EF.state.mouse.x + "px";
      ring.style.top = EF.state.mouse.y + "px";
      ring.style.opacity = r.opacity;
      // 一旦リセット
      ring.style.borderWidth = "0"; ring.style.background = "transparent"; ring.style.boxShadow = "none";
      if (dot) dot.style.display = "none";
      if (arrow) arrow.style.display = "none";
      ring.style.transform = "translate(-50%, -50%)";
      if (style === "arrow") {
        // 矢印カーソル：先端をマウス位置に合わせる
        ring.style.transform = "translate(" + (-(3 / 24) * r.size) + "px, " + (-(2 / 24) * r.size) + "px)";
        if (arrow) {
          arrow.style.display = "block";
          arrow.style.width = r.size + "px"; arrow.style.height = r.size + "px";
          const path = arrow.querySelector("path");
          if (path) path.setAttribute("fill", color);
        }
        return;
      }
      if (style === "ring" || style === "ringdot") {
        ring.style.borderWidth = r.width + "px";
        ring.style.borderColor = color;
      }
      if (style === "halo") {
        ring.style.background = "radial-gradient(circle, " + color + "cc 0%, " + color + "44 38%, transparent 70%)";
      }
      if (style === "dot" || style === "ringdot") {
        if (dot) {
          const ds = style === "dot" ? Math.max(10, r.size * 0.42) : Math.max(8, r.size * 0.24);
          dot.style.display = "block";
          dot.style.width = ds + "px"; dot.style.height = ds + "px";
          dot.style.background = color;
        }
      }
    },
  };
})();

</script>
<script>
/* ============================================================
   spotlight.js — スポットライト（カーソル周辺以外を暗転）
   ============================================================ */
(function () {
  const EF = (window.EF = window.EF || {});

  let canvas, ctx, dpr, w, h, raf;
  let radius = 130;

  function resize() {
    const r = canvas.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    w = r.width; h = r.height;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function render() {
    ctx.clearRect(0, 0, w, h);
    if (!EF.state.spotlight) { raf = requestAnimationFrame(render); return; }

    ctx.fillStyle = "rgba(8,10,16," + (EF.state.spotDim || 0.72) + ")";
    ctx.fillRect(0, 0, w, h);

    const m = EF.state.mouse;
    if (m.inStage) {
      ctx.save();
      ctx.globalCompositeOperation = "destination-out";
      if (EF.state.spotShape === "band") {
        // カーソルのY位置を中心にした横帯（高さはビューポート比で選択）
        const bandH = Math.max(60, h * (EF.state.spotBand || 0.5));
        const top = Math.min(Math.max(m.y - bandH / 2, 0), h - bandH);
        const soft = Math.min(0.18, 28 / bandH);
        const grad = ctx.createLinearGradient(0, top, 0, top + bandH);
        grad.addColorStop(0, "rgba(0,0,0,0)");
        grad.addColorStop(soft, "rgba(0,0,0,1)");
        grad.addColorStop(1 - soft, "rgba(0,0,0,1)");
        grad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, top, w, bandH);
      } else {
        const grad = ctx.createRadialGradient(m.x, m.y, radius * 0.55, m.x, m.y, radius);
        grad.addColorStop(0, "rgba(0,0,0,1)");
        grad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(m.x, m.y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    raf = requestAnimationFrame(render);
  }

  EF.spotlight = {
    init() {
      canvas = document.getElementById("spotlight-canvas");
      ctx = canvas.getContext("2d");
      resize();
      window.addEventListener("resize", resize);
      render();
    },
    setRadius(px) { radius = Math.max(60, Math.min(360, px)); },
    adjust(delta) {
      if (EF.state.spotShape === "band") {
        const opts = [0.25, 0.5, 0.75];
        const i = opts.indexOf(EF.state.spotBand);
        EF.state.spotBand = opts[Math.min(opts.length - 1, Math.max(0, (i < 0 ? 1 : i) + (delta > 0 ? 1 : -1)))];
      } else { this.setRadius(radius + delta); }
    },
  };
})();

</script>
<script>
/* ============================================================
   zoom.js — カーソル周辺ズーム
   #zoomable（コンテンツ＋注釈レイヤー）に CSS transform を当て、
   transform-origin をカーソルに追従させることで「カーソル周辺を拡大」。
   カーソルリングはステージ直下にあるため実位置に留まる＝点が一致。
   ============================================================ */
(function () {
  const EF = (window.EF = window.EF || {});

  let zoomable;

  function apply() {
    const m = EF.state.mouse;
    if (!EF.state.zoom || !m.inStage) {
      zoomable.style.transform = "scale(1)";
      return;
    }
    const stage = document.getElementById("stage");
    const r = stage.getBoundingClientRect();
    const ox = (m.x / r.width) * 100;
    const oy = (m.y / r.height) * 100;
    zoomable.style.transformOrigin = `${ox}% ${oy}%`;
    zoomable.style.transform = `scale(${EF.state.zoomScale})`;
  }

  EF.zoom = {
    init() {
      zoomable = document.getElementById("zoomable");
      EF.on("mousemove", apply);
    },
    refresh: apply,
    setScale(s) {
      EF.state.zoomScale = Math.max(1.4, Math.min(5, s));
      apply();
      EF.setStatus();
    },
    adjust(delta) { this.setScale(EF.state.zoomScale + delta); },
  };
})();

</script>
<script>
/* ============================================================
   toolbar.js — 常駐ミニツールバーの構築とイベント配線
   ============================================================ */
(function () {
  const EF = (window.EF = window.EF || {});

  // 並べ替え・表示/非表示の対象ツール定義（key,label,ic,kind）
  EF.TOOL_DEFS = [
    { key: "cursor", label: "カーソル", ic: "cursor", kind: "tool" },
    { key: "pen", label: "ペン", ic: "pen", kind: "tool" },
    { key: "highlighter", label: "蛍光", ic: "highlighter", kind: "tool" },
    { key: "arrow", label: "矢印", ic: "arrow", kind: "tool" },
    { key: "hline", label: "横線", ic: "hline", kind: "tool" },
    { key: "ellipse", label: "丸", ic: "ellipse", kind: "tool" },
    { key: "rect", label: "四角", ic: "rect", kind: "tool" },
    { key: "text", label: "文字", ic: "text", kind: "tool" },
    { key: "spotlight", label: "注目", ic: "spotlight", kind: "toggle" },
    { key: "zoom", label: "ズーム", ic: "zoom", kind: "toggle" },
  ];
  EF.toolDef = function (key) { return EF.TOOL_DEFS.find((d) => d.key === key); };

  EF.toolbar = {
    init() {
      const tb = document.getElementById("toolbar");
      if (EF.fillIcons) EF.fillIcons(document); // 絵文字→SVGアイコン

      // カラースウォッチ生成
      this.buildColors();

      // ツール群を動的生成（並べ替え・表示/非表示反映）
      this.buildTools();

      // ツール選択/トグルは #tb-tools へ委譲
      const tbtools = document.getElementById("tb-tools");
      tbtools.addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        if (b.dataset.tool) EF.app.setTool(b.dataset.tool);
        else if (b.dataset.toggle) EF.app.toggle(b.dataset.toggle);
      });

      // アクション
      tb.querySelectorAll("[data-action]").forEach((b) =>
        b.addEventListener("click", () => EF.app.action(b.dataset.action)));

      // 収納ハンドル
      document.getElementById("tb-handle").addEventListener("click", () => {
        tb.dataset.collapsed = tb.dataset.collapsed === "true" ? "false" : "true";
      });

      this.fit();
      window.addEventListener("resize", () => this.fit());
      this.sync();
    },

    // カラースウォッチ（パレット編集後の再生成にも使う）
    buildColors() {
      const colors = document.getElementById("tb-colors");
      colors.innerHTML = "";
      EF.PALETTE.forEach((c) => {
        const sw = document.createElement("div");
        sw.className = "swatch";
        sw.style.background = c.value;
        sw.dataset.color = c.value;
        sw.title = c.name;
        sw.addEventListener("click", () => EF.app.setColor(c.value));
        colors.appendChild(sw);
      });
      this.sync();
    },

    // ツール群（並べ替え順・表示/非表示を反映して再生成）
    buildTools() {
      const tbtools = document.getElementById("tb-tools");
      if (!tbtools) return;
      tbtools.innerHTML = "";
      const titles = {
        cursor: "カーソル強調", pen: "ペン (⌘⇧1)", highlighter: "蛍光ペン",
        arrow: "矢印 (⌘⇧2)", hline: "横線（高さ固定・アンダーライン）",
        ellipse: "丸囲み (⌘⇧3)", rect: "四角囲み (⌘⇧4)", text: "テキスト注釈",
        spotlight: "スポットライト (⌘⇧5)", zoom: "ズーム (⌘⇧6)",
      };
      EF.state.toolOrder.forEach((key) => {
        if (EF.state.toolHidden[key]) return;
        const def = EF.toolDef(key);
        if (!def) return;
        const b = document.createElement("button");
        b.className = "tool";
        if (def.kind === "toggle") {
          b.dataset.toggle = key;
          b.id = key === "spotlight" ? "btn-spotlight" : key === "zoom" ? "btn-zoom" : "";
        } else {
          b.dataset.tool = key;
          if (key === "cursor") b.id = "btn-cursor";
        }
        b.title = titles[key] || def.label;
        b.innerHTML = `<span class="ico" data-ic="${def.ic}"></span><span class="lbl">${def.label}</span>`;
        tbtools.appendChild(b);
      });
      if (EF.fillIcons) EF.fillIcons(tbtools);
      this.sync();
    },

    // ウィンドウ高さに収まらなければアイコンのみのコンパクト表示に自動切替
    fit() {
      const tb = document.getElementById("toolbar");
      tb.classList.remove("compact");
      if (tb.scrollHeight > window.innerHeight - 168) tb.classList.add("compact");
    },

    // 状態をUIへ反映
    sync() {
      const tb = document.getElementById("toolbar");
      tb.classList.toggle("app-off", !EF.state.appOn);

      tb.querySelectorAll("[data-tool]").forEach((b) =>
        b.classList.toggle("active", EF.state.appOn && b.dataset.tool === EF.state.tool));

      const btnSpot = document.getElementById("btn-spotlight");
      if (btnSpot) btnSpot.classList.toggle("toggled", EF.state.spotlight);
      const btnZoom = document.getElementById("btn-zoom");
      if (btnZoom) btnZoom.classList.toggle("toggled", EF.state.zoom);

      const btnApp = document.getElementById("btn-app");
      btnApp.classList.toggle("active", EF.state.appOn);
      btnApp.querySelector(".lbl").textContent = EF.state.appOn ? "稼働中" : "起動";

      document.querySelectorAll(".swatch").forEach((s) =>
        s.classList.toggle("active", s.dataset.color === EF.state.color));

    },
  };
})();

</script>
<script>
/* ============================================================
   shortcuts.js — グローバル風キーボードショートカット
   実機(macOSネイティブ)ではOSのグローバルショートカットになる想定。
   Webでは ⌘/Ctrl + ⇧ + キー を横取りしてプロトタイプの操作に割当てる。
   ============================================================ */
(function () {
  const EF = (window.EF = window.EF || {});

  EF.shortcuts = {
    init() {
      window.addEventListener("keydown", (ev) => {
        const mod = ev.metaKey || ev.ctrlKey;

        // Esc: 注釈ツール解除→カーソルへ / モーダル閉じる
        if (ev.key === "Escape") {
          if (EF.app.handleEscape()) ev.preventDefault();
          return;
        }

        // Delete / Backspace 単体で「1つ戻る」（直感操作）。入力欄では無効。
        if ((ev.key === "Backspace" || ev.key === "Delete") && !mod && !ev.shiftKey) {
          const ae = document.activeElement;
          if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
          if (EF.state.appOn) { ev.preventDefault(); EF.annot.engine.undo(); EF.toast("1つ戻しました"); }
          return;
        }

        // Shift併用だと ev.key が記号化（2→@）するため ev.code で判定する
        const code = ev.code;
        if (mod && ev.shiftKey) {
          // ⌘⇧E : アプリ ON/OFF（OFF時はクイックパレット表示）
          if (code === "KeyE") { ev.preventDefault(); EF.app.toggleApp(); return; }
          if (!EF.state.appOn) return;

          if (code === "Digit1") { ev.preventDefault(); EF.app.setTool("pen"); return; }
          if (code === "Digit2") { ev.preventDefault(); EF.app.setTool("arrow"); return; }
          if (code === "Digit3") { ev.preventDefault(); EF.app.setTool("ellipse"); return; }
          if (code === "Digit4") { ev.preventDefault(); EF.app.setTool("rect"); return; }
          if (code === "Digit5") { ev.preventDefault(); EF.app.toggle("spotlight"); return; }
          if (code === "Digit6") { ev.preventDefault(); EF.app.toggle("zoom"); return; }
          if (code === "KeyH") { ev.preventDefault(); EF.app.toggleUI(); return; }
          if (ev.key === "Backspace" || ev.key === "Delete") { ev.preventDefault(); EF.app.action("clear"); return; }
        }

        // ⌘Z : 元に戻す（注釈レイヤー）
        if (mod && !ev.shiftKey && code === "KeyZ") {
          if (EF.state.appOn) { ev.preventDefault(); EF.annot.engine.undo(); }
          return;
        }

        // 補助: スポットライト半径 [ / ] 、ズーム倍率 - / =
        if (EF.state.appOn && !mod) {
          if (EF.state.spotlight && (ev.key === "[" || ev.key === "]")) {
            EF.spotlight.adjust(ev.key === "[" ? -25 : 25); ev.preventDefault(); return;
          }
          if (EF.state.zoom && (ev.key === "-" || ev.key === "=" || ev.key === "+")) {
            EF.zoom.adjust(ev.key === "-" ? -0.3 : 0.3); ev.preventDefault(); return;
          }
        }
      });
    },
  };
})();

</script>
<script>
/* ============================================================
   screenshot.js — 注釈付きスクリーンショット保存
   html2canvas でステージ全体（共有画面＋注釈）を画像化する。
   ファイル名は 20260627_商談レビュー_注釈.png 形式で自動生成。
   ============================================================ */
(function () {
  const EF = (window.EF = window.EF || {});

  const SCENE_LABEL = { proposal: "提案資料", kpi: "KPIレビュー", salesforce: "商談画面" };

  function stamp() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
  }

  function activeScene() {
    const b = document.querySelector(".ss-btn.active");
    return (b && b.dataset.scene) || "proposal";
  }

  EF.screenshot = {
    async capture() {
      if (typeof html2canvas !== "function") {
        EF.toast("html2canvas が読み込めませんでした");
        return;
      }
      EF.toast("スクリーンショットを生成中…", 1200);
      const stage = document.getElementById("stage");
      try {
        const canvas = await html2canvas(stage, {
          backgroundColor: "#0f1626",
          scale: Math.min(2, window.devicePixelRatio || 1),
          logging: false,
          ignoreElements: (el) =>
            el.id === "toolbar" || el.id === "stamp-bar" ||
            el.id === "scene-switch" || el.id === "status-badge" ||
            el.id === "toast" || el.id === "cursor-ring" || el.id === "stamp-hint",
        });
        const name = `${stamp()}_${SCENE_LABEL[activeScene()]}_注釈.png`;
        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = name;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          EF.toast(`保存しました: ${name}`, 2200);
        }, "image/png");
      } catch (e) {
        console.error(e);
        EF.toast("スクショ生成に失敗しました");
      }
    },
  };
})();

</script>
<script>
/* ============================================================
   presets.js — 設定モーダル（プリセットは廃止／設定は自動保存）
   ============================================================ */
(function () {
  const EF = (window.EF = window.EF || {});

  function $(id) { return document.getElementById(id); }
  const save = () => EF.saveSettings && EF.saveSettings();

  EF.presets = {
    init() {
      // カラーパレット編集
      this.buildPalette();

      // ツールバー（並べ替え・表示/非表示）
      this.buildToolList();

      // スライダー類（変更時に保存）
      this.bindRange("set-ring-width", "out-ring-width", (v) => { EF.state.ring.width = +v; EF.cursor.update(); }, (v) => v + "px");
      this.bindRange("set-ring-size", "out-ring-size", (v) => { EF.state.ring.size = +v; EF.cursor.update(); }, (v) => v + "px");
      this.bindRange("set-ring-opacity", "out-ring-opacity", (v) => { EF.state.ring.opacity = v / 100; EF.cursor.update(); }, (v) => v + "%");
      this.bindRange("set-stroke-width", "out-stroke-width", (v) => { EF.state.strokeWidth = +v; }, (v) => v + "px");

      $("set-click-ripple").addEventListener("change", (e) => { EF.state.ring.ripple = e.target.checked; save(); });

      // セグメント共通ヘルパー
      const seg = (id, attr, apply) =>
        $(id).querySelectorAll("button").forEach((b) =>
          b.addEventListener("click", () => {
            apply(b.dataset[attr], b);
            $(id).querySelectorAll("button").forEach((x) => x.classList.toggle("active", x === b));
            if (EF.options) EF.options.render();
            EF.cursor.update();
            save();
          }));

      seg("set-cursor-style", "cursor", (v) => { EF.state.cursorStyle = v; });
      seg("set-cursor-size", "size", (v) => {
        EF.state.ring.size = +v;
        $("set-ring-size").value = EF.state.ring.size; $("out-ring-size").textContent = EF.state.ring.size + "px";
      });
      seg("set-arrow-head", "head", (v) => { EF.state.arrowHead = v; });
      seg("set-spot-shape", "shape", (v) => { EF.state.spotShape = v; });
      seg("set-spot-band", "band", (v) => { EF.state.spotBand = parseFloat(v); });
      seg("set-spot-dim", "dim", (v) => { EF.state.spotDim = parseFloat(v); });
      seg("set-zoom-scale", "zoom", (v) => { EF.state.zoomScale = parseFloat(v); EF.zoom.refresh(); EF.setStatus(); });

      // バーの配置
      seg("set-bar-side", "side", (v) => { EF.state.barSide = v; EF.app.applyLayout(); });
      seg("set-dock-pos", "pos", (v) => { EF.state.dockPos = v; EF.app.applyLayout(); });

      // テキスト設定
      seg("set-text-size", "size", (v) => { EF.state.textSize = +v; });
      seg("set-text-weight", "weight", (v) => { EF.state.textBold = (v === "bold"); });
      this.buildTextColors();

      // オプションパネルの表示/非表示
      $("set-show-options").addEventListener("change", (e) => {
        EF.state.showOptions = e.target.checked;
        if (EF.options) EF.options.render();
        save();
      });

      // 閉じる
      document.querySelectorAll('[data-action="close-settings"]').forEach((b) =>
        b.addEventListener("click", () => this.closeModal()));
      $("settings").addEventListener("click", (e) => { if (e.target.id === "settings") this.closeModal(); });

      // 起動時に現在の状態をUIへ反映
      this.syncUI();
    },

    bindRange(inId, outId, onInput, fmt) {
      const inp = $(inId), out = $(outId);
      inp.addEventListener("input", () => { onInput(inp.value); out.textContent = fmt(inp.value); });
      inp.addEventListener("change", save);
    },

    // カラーパレット編集（クリックで色変更・自動保存）
    buildPalette() {
      const box = $("palette-edit");
      box.innerHTML = "";
      EF.PALETTE.forEach((c, i) => {
        const inp = document.createElement("input");
        inp.type = "color";
        inp.className = "pal-color";
        inp.value = c.value;
        inp.title = c.name;
        inp.addEventListener("input", () => {
          const old = EF.PALETTE[i].value;
          EF.PALETTE[i].value = inp.value;
          if (EF.state.color === old) EF.state.color = inp.value; // 選択中の色も追従
          EF.toolbar.buildColors();
          EF.cursor.update();
          save();
        });
        box.appendChild(inp);
      });
    },

    // ツールバーの並べ替え（ドラッグ＆ドロップ）・表示/非表示リスト
    buildToolList() {
      const box = $("set-tools");
      if (!box) return;
      box.innerHTML = "";
      const order = EF.state.toolOrder;
      order.forEach((key) => {
        const def = EF.toolDef ? EF.toolDef(key) : null;
        if (!def) return;
        const row = document.createElement("div");
        row.className = "set-tool-row";
        row.draggable = true;
        row.dataset.key = key;

        const grip = document.createElement("span");
        grip.className = "st-grip";
        grip.title = "ドラッグで並べ替え";
        grip.innerHTML = EF.iconSvg ? EF.iconSvg("grip", 16) : "⋮⋮";

        const lab = document.createElement("label");
        lab.className = "st-label";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = !EF.state.toolHidden[key];
        cb.addEventListener("change", () => {
          if (cb.checked) delete EF.state.toolHidden[key];
          else EF.state.toolHidden[key] = true;
          if (EF.toolbar) EF.toolbar.buildTools();
          save();
        });
        const icoSpan = document.createElement("span");
        icoSpan.className = "st-ico";
        icoSpan.innerHTML = EF.iconSvg ? EF.iconSvg(def.ic, 16) : "";
        const txt = document.createElement("span");
        txt.textContent = def.label;
        lab.appendChild(cb);
        lab.appendChild(icoSpan);
        lab.appendChild(txt);

        row.appendChild(grip);
        row.appendChild(lab);

        // ドラッグ＆ドロップ並べ替え
        row.addEventListener("dragstart", (e) => {
          this._dragKey = key;
          e.dataTransfer.effectAllowed = "move";
          row.classList.add("dragging");
        });
        row.addEventListener("dragend", () => row.classList.remove("dragging"));
        row.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; row.classList.add("drag-over"); });
        row.addEventListener("dragleave", () => row.classList.remove("drag-over"));
        row.addEventListener("drop", (e) => { e.preventDefault(); row.classList.remove("drag-over"); this.reorderTool(this._dragKey, key); });

        box.appendChild(row);
      });
    },

    reorderTool(fromKey, toKey) {
      if (!fromKey || fromKey === toKey) return;
      const order = EF.state.toolOrder;
      const fi = order.indexOf(fromKey);
      if (fi < 0) return;
      order.splice(fi, 1);
      const ti = order.indexOf(toKey);
      order.splice(ti < 0 ? order.length : ti, 0, fromKey); // ドロップ先の前に挿入
      if (EF.toolbar) EF.toolbar.buildTools();
      save();
      this.buildToolList();
    },

    // テキスト色（パレットから選択）
    buildTextColors() {
      const box = $("set-text-color");
      box.innerHTML = "";
      EF.PALETTE.forEach((c) => {
        const sw = document.createElement("div");
        sw.className = "swatch";
        sw.style.background = c.value;
        sw.dataset.color = c.value;
        sw.addEventListener("click", () => {
          EF.state.textColor = c.value;
          box.querySelectorAll(".swatch").forEach((s) => s.classList.toggle("active", s === sw));
          save();
        });
        box.appendChild(sw);
      });
    },

    syncUI() {
      $("set-show-options").checked = EF.state.showOptions;
      $("set-ring-width").value = EF.state.ring.width; $("out-ring-width").textContent = EF.state.ring.width + "px";
      $("set-ring-size").value = EF.state.ring.size; $("out-ring-size").textContent = EF.state.ring.size + "px";
      $("set-ring-opacity").value = Math.round(EF.state.ring.opacity * 100); $("out-ring-opacity").textContent = Math.round(EF.state.ring.opacity * 100) + "%";
      $("set-stroke-width").value = EF.state.strokeWidth; $("out-stroke-width").textContent = EF.state.strokeWidth + "px";
      $("set-click-ripple").checked = EF.state.ring.ripple;
      const setActive = (id, attr, val) =>
        $(id).querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset[attr] === String(val)));
      setActive("set-cursor-style", "cursor", EF.state.cursorStyle);
      setActive("set-cursor-size", "size", EF.state.ring.size);
      setActive("set-arrow-head", "head", EF.state.arrowHead);
      setActive("set-spot-shape", "shape", EF.state.spotShape);
      setActive("set-spot-band", "band", EF.state.spotBand);
      setActive("set-spot-dim", "dim", EF.state.spotDim);
      setActive("set-zoom-scale", "zoom", EF.state.zoomScale);
      setActive("set-bar-side", "side", EF.state.barSide);
      setActive("set-dock-pos", "pos", EF.state.dockPos);
      setActive("set-text-size", "size", EF.state.textSize);
      setActive("set-text-weight", "weight", EF.state.textBold ? "bold" : "normal");
      $("set-text-color").querySelectorAll(".swatch").forEach((s) =>
        s.classList.toggle("active", s.dataset.color === EF.state.textColor));
    },

    openModal() { this.syncUI(); this.buildToolList(); $("settings").hidden = false; },
    closeModal() { $("settings").hidden = true; },
  };
})();

</script>
<script>
/* ============================================================
   app.js — メインオーケストレーター
   各モジュールを初期化し、注釈レイヤーのポインタ操作と
   ツールバー/ショートカットからのコマンドを束ねる。
   ============================================================ */
(function () {
  const EF = (window.EF = window.EF || {});

  const DRAW_TOOLS = ["pen", "highlighter", "arrow", "hline", "ellipse", "rect", "text"];

  // 注釈レイヤー（ステージ上の描画）
  EF.annot = {
    engine: null,
    drawing: false,
    init() {
      const canvas = document.getElementById("annot-canvas");
      this.engine = new EF.DrawingEngine(canvas, {
        getStyle: () => ({ tool: EF.state.tool, color: EF.state.color, width: EF.state.strokeWidth, head: EF.state.arrowHead }),
        getAutoErase: () => 0,
      });
      window.addEventListener("resize", () => this.engine.resize());

      const stage = document.getElementById("stage");
      stage.addEventListener("mousedown", (ev) => {
        if (!EF.state.appOn || ev.button !== 0) return;
        const p = EF.stagePoint(ev);
        // ズーム中は座標がずれるため描画しない（表示専用）
        if (EF.state.zoom) return;
        // テキストはインライン入力欄で（既存テキストをクリックしたら再編集）
        if (EF.state.tool === "text") {
          ev.preventDefault();
          const hit = this.engine.hitText(p.x, p.y);
          EF.app.showTextInput(p, hit);
          return;
        }
        if (DRAW_TOOLS.indexOf(EF.state.tool) === -1) return;
        this.drawing = true;
        this.engine.start(p.x, p.y);
      });
      stage.addEventListener("mousemove", (ev) => {
        if (!this.drawing) return;
        const p = EF.stagePoint(ev);
        this.engine.move(p.x, p.y);
      });
      window.addEventListener("mouseup", () => {
        if (this.drawing) { this.drawing = false; this.engine.end(); }
      });
    },
  };

  // コマンド面
  EF.app = {
    setTool(tool) {
      if (!EF.state.appOn) this.toggleApp(true);
      EF.state.tool = tool;
      const stage = document.getElementById("stage");
      stage.classList.toggle("tool-cursor", tool === "cursor");
      stage.classList.toggle("armed", tool !== "cursor");
      EF.toolbar.sync();
      EF.options.render();
      EF.setStatus();
    },

    // インラインのテキスト入力欄。hit を渡すと既存テキストの再編集。
    showTextInput(p, hit) {
      const stage = document.getElementById("stage");
      const old = stage.querySelector(".ef-text-input");
      if (old) old.remove();
      const x = hit ? hit.a.x : p.x, y = hit ? hit.a.y : p.y;
      const color = hit ? hit.color : EF.state.textColor;
      const size = hit ? hit.size : EF.state.textSize;
      const weight = hit ? hit.weight : (EF.state.textBold ? 800 : 500);
      if (hit) hit._editing = true; // 編集中は元の描画を隠す
      const inp = document.createElement("input");
      inp.className = "ef-text-input";
      inp.type = "text";
      inp.value = hit ? hit.text : "";
      inp.style.left = x + "px";
      inp.style.top = y + "px";
      inp.style.color = color;
      inp.style.fontSize = size + "px";
      inp.style.fontWeight = weight;
      stage.appendChild(inp);
      requestAnimationFrame(() => { inp.focus(); inp.select(); });
      let done = false;
      const close = (keep) => {
        if (done) return; done = true;
        inp.removeEventListener("blur", onBlur);
        const v = inp.value.trim();
        if (inp.isConnected) inp.remove();
        if (hit) {
          hit._editing = false;
          if (!keep) return;                       // Escはそのまま
          if (v) hit.text = v;                      // 更新
          else EF.annot.engine.removeStroke(hit);   // 空なら削除
        } else if (keep && v) {
          EF.annot.engine.addText(x, y, v, { color: color, size: size, weight: weight });
        }
      };
      const onBlur = () => close(true);
      inp.addEventListener("keydown", (e) => {
        e.stopPropagation();
        if (e.key === "Enter") close(true);
        else if (e.key === "Escape") close(false);
      });
      inp.addEventListener("blur", onBlur);
    },

    setColor(color) {
      EF.state.color = color;
      EF.cursor.update();
      EF.toolbar.sync();
      EF.setStatus();
      if (EF.saveSettings) EF.saveSettings();
    },

    toggle(what) {
      if (!EF.state.appOn) this.toggleApp(true);
      if (what === "spotlight") {
        EF.state.spotlight = !EF.state.spotlight;
        EF.toast(EF.state.spotlight ? "スポットライト ON （[ ] で広さ調整）" : "スポットライト OFF");
      } else if (what === "zoom") {
        EF.state.zoom = !EF.state.zoom;
        EF.zoom.refresh();
        EF.toast(EF.state.zoom ? "ズーム ON （- = で倍率調整）" : "ズーム OFF");
      }
      EF.toolbar.sync();
      EF.options.render();
      EF.setStatus();
    },

    action(name) {
      switch (name) {
        case "toggle-app": this.toggleApp(); break;
        case "undo": if (EF.state.appOn) EF.annot.engine.undo(); break;
        case "clear":
          EF.annot.engine.clear();
          EF.toast("注釈を全消去しました");
          break;
        case "screenshot": EF.screenshot.capture(); break;
        case "record": this.toggleRecord(); break;
        case "settings": EF.presets.openModal(); break;
        case "hide-ui": this.toggleUI(); break;
      }
    },

    // 画面録画ボタンの見た目を更新（録画中=赤・停止アイコン）
    _syncRecordBtn() {
      const btn = document.querySelector('.tool[data-action="record"]');
      if (!btn) return;
      const rec = !!EF.state.recording;
      btn.classList.toggle("recording", rec);
      const ico = btn.querySelector(".ico");
      if (ico) {
        const name = rec ? "stop" : "record";
        ico.dataset.ic = name;
        if (EF.iconSvg) ico.innerHTML = EF.iconSvg(name);
      }
      const lbl = btn.querySelector(".lbl");
      if (lbl) lbl.textContent = rec ? "停止" : "録画";
      btn.title = rec ? "録画を停止" : "画面録画 (webm保存)";
    },

    // 画面録画のトグル（getDisplayMedia + MediaRecorder）
    toggleRecord() {
      if (EF.state.recording) { this._stopRecord(); return; }
      this._startRecord();
    },

    async _startRecord() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        EF.toast("この環境では画面録画に対応していません", 2600);
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: true });
      } catch (err) {
        EF.toast("画面録画を開始できませんでした（権限が許可されていない可能性があります）", 2800);
        return;
      }
      let rec;
      try {
        const opt = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
          ? { mimeType: "video/webm;codecs=vp9" } : { mimeType: "video/webm" };
        rec = new MediaRecorder(stream, opt);
      } catch (err) {
        stream.getTracks().forEach((t) => t.stop());
        EF.toast("録画の初期化に失敗しました", 2600);
        return;
      }
      const chunks = [];
      rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        const blob = new Blob(chunks, { type: "video/webm" });
        const d = new Date(), p = (n) => String(n).padStart(2, "0");
        const fn = `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}_画面録画.webm`;
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = fn;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        EF._recorder = null;
        EF.state.recording = false;
        this._syncRecordBtn();
        EF.toast("録画を保存しました: " + fn, 2600);
      };
      // ユーザーが共有を停止した場合も録画停止
      const vt = stream.getVideoTracks()[0];
      if (vt) vt.onended = () => { if (EF.state.recording) this._stopRecord(); };
      EF._recorder = rec;
      EF.state.recording = true;
      this._syncRecordBtn();
      rec.start();
      EF.toast("画面録画を開始しました（もう一度押すと停止）", 2600);
    },

    _stopRecord() {
      const rec = EF._recorder;
      if (rec && rec.state !== "inactive") {
        try { rec.stop(); } catch (e) { /* noop */ }
      } else {
        EF.state.recording = false;
        this._syncRecordBtn();
      }
    },

    // ポインターモード（アプリ）のかんたんON/OFF（パレットを出さない）
    togglePointer() {
      if (EF.state.appOn) this.toggleApp();
      else this.toggleApp(true);
    },

    // UI（ツールバー・サイドバー等）の表示/非表示
    toggleUI() {
      if (!EF.state.appOn) return;
      EF.state.uiHidden = !EF.state.uiHidden;
      document.body.classList.toggle("ef-ui-hidden", EF.state.uiHidden);
      EF.dock.update();
      EF.toast(EF.state.uiHidden ? "バーを非表示にしました（右下のドックで再表示）" : "バーを表示しました");
    },

    toggleApp(forceOn) {
      const next = forceOn ? true : !EF.state.appOn;
      // OFF→ONかつ強制でない場合はクイックパレットを一瞬見せる演出
      EF.state.appOn = next;
      document.body.classList.toggle("ef-on", next);
      if (!next) {
        // 全モードを畳む
        EF.state.spotlight = false;
        EF.state.zoom = false;
        EF.zoom.refresh();
        EF.state.uiHidden = false;
        document.body.classList.remove("ef-ui-hidden");
        document.getElementById("stage").classList.remove("armed", "tool-cursor");
        EF.toast("Enmish Pointer を終了");
      } else {
        document.getElementById("stage").classList.add(
          EF.state.tool === "cursor" ? "tool-cursor" : "armed");
        if (!EF._onboarded) {
          EF._onboarded = true;
          EF.toast("ツールを選んでドラッグで注釈 ／ 右下ドックでON/OFF・バー表示 ／ ⚙設定で配置や詳細を変更", 4600);
        } else {
          EF.toast("Enmish Pointer 起動 — カーソル強調中");
        }
      }
      document.body.classList.toggle("bar-left", EF.state.barSide === "left");
      EF.cursor.update();
      EF.toolbar.sync();
      EF.options.render();
      EF.dock.update();
      EF.setStatus();
    },

    // バーの配置（ツールバー左右・ドック位置）を反映
    applyLayout() {
      const tb = document.getElementById("toolbar");
      if (tb) tb.classList.toggle("side-left", EF.state.barSide === "left");
      document.body.classList.toggle("bar-left", EF.state.barSide === "left");
      const dock = document.getElementById("ef-dock");
      if (dock) {
        dock.classList.remove("dock-bottom-right", "dock-top-left", "dock-top-right");
        if (EF.state.dockPos && EF.state.dockPos !== "bottom-left") dock.classList.add("dock-" + EF.state.dockPos);
      }
      if (EF.toolbar && EF.toolbar.fit) EF.toolbar.fit();
    },

    // Esc処理。何か閉じたら true。
    handleEscape() {
      if (!document.getElementById("settings").hidden) { EF.presets.closeModal(); return true; }
      if (EF.state.uiHidden) { this.toggleUI(); return true; }
      if (EF.state.zoom) { EF.state.zoom = false; EF.zoom.refresh(); EF.toolbar.sync(); EF.setStatus(); return true; }
      if (EF.state.spotlight) { EF.state.spotlight = false; EF.toolbar.sync(); EF.setStatus(); return true; }
      if (EF.state.appOn && EF.state.tool !== "cursor") { this.setTool("cursor"); return true; }
      return false;
    },
  };

  // ツール別オプション（カーソル形状 / 矢じり向き / 注目の帯）
  function optGroup(title, opt, cur, items) {
    const btns = items.map((it) =>
      `<button class="to-btn${String(it[0]) === String(cur) ? " on" : ""}" data-opt="${opt}" data-val="${it[0]}">` +
      (it[1] ? `<span class="to-ico">${it[1]}</span>` : "") + `<span>${it[2]}</span></button>`).join("");
    return `<div class="to-group"><div class="to-title">${title}</div><div class="to-btns">${btns}</div></div>`;
  }
  EF.options = {
    render() {
      const el = document.getElementById("tool-options");
      if (!el) return;
      if (!EF.state.showOptions) { el.hidden = true; return; }
      const groups = [];
      if (EF.state.appOn && EF.state.tool === "cursor") {
        groups.push(optGroup("カーソル", "cursorStyle", EF.state.cursorStyle,
          [["ring", "◎", "リング"], ["arrow", "➤", "矢印"], ["dot", "●", "ドット"], ["ringdot", "◉", "両方"], ["halo", "✦", "ハロー"]]));
        groups.push(optGroup("大きさ", "ringSize", EF.state.ring.size,
          [[28, "", "極小"], [44, "", "小"], [60, "", "中"]]));
      } else if (EF.state.appOn && EF.state.tool === "arrow") {
        groups.push(optGroup("矢じり", "arrowHead", EF.state.arrowHead,
          [["end", "→", "終点"], ["start", "←", "始点"], ["both", "↔", "両方"]]));
      }
      if (EF.state.appOn && EF.state.spotlight) {
        groups.push(optGroup("注目の形", "spotShape", EF.state.spotShape,
          [["band", "▭", "帯"], ["circle", "◯", "丸"]]));
        if (EF.state.spotShape === "band") {
          groups.push(optGroup("帯の高さ", "spotBand", EF.state.spotBand,
            [[0.25, "", "25%"], [0.5, "", "50%"], [0.75, "", "75%"]]));
        }
      }
      if (!groups.length) { el.hidden = true; return; }
      el.innerHTML = groups.join("");
      el.hidden = false;
    },
    bind() {
      const el = document.getElementById("tool-options");
      el.addEventListener("click", (e) => {
        const b = e.target.closest(".to-btn"); if (!b) return;
        const opt = b.dataset.opt; let v = b.dataset.val;
        if (opt === "ringSize") EF.state.ring.size = parseFloat(v);
        else if (opt === "spotBand") EF.state.spotBand = parseFloat(v);
        else EF.state[opt] = v;
        EF.cursor.update();
        this.render();
        EF.setStatus();
        if (EF.saveSettings) EF.saveSettings();
      });
    },
  };

  // 常駐ドック
  EF.dock = {
    init() {
      document.getElementById("dock-power").addEventListener("click", () => EF.app.togglePointer());
      document.getElementById("dock-bars").addEventListener("click", () => EF.app.toggleUI());
      this.update();
    },
    update() {
      const power = document.getElementById("dock-power");
      const bars = document.getElementById("dock-bars");
      power.classList.toggle("on", EF.state.appOn);
      power.querySelector(".lbl").textContent = EF.state.appOn ? "ポインターON" : "ポインター";
      bars.classList.toggle("dim", !EF.state.appOn);
      bars.classList.toggle("on", EF.state.appOn && EF.state.uiHidden);
      bars.querySelector(".lbl").textContent = EF.state.uiHidden ? "バー表示" : "バー隠す";
    },
  };

  // シーン切替
  function bindScenes() {
    document.querySelectorAll(".ss-btn").forEach((b) =>
      b.addEventListener("click", () => EF.setScene(b.dataset.scene)));
  }

  // 初期化
  window.addEventListener("DOMContentLoaded", () => {
    EF.setScene("proposal");
    EF.cursor.init();
    EF.annot.init();
    EF.spotlight.init();
    EF.zoom.init();
    EF.toolbar.init();
    EF.shortcuts.init();
    EF.presets.init();
    bindScenes();
    EF.options.bind();
    EF.options.render();
    EF.dock.init();
    EF.app.applyLayout();

    EF.toolbar.sync();
    EF.toast("Enmish Pointer プロトタイプ — ⌘⇧E で起動", 2600);
  });
})();

</script>
