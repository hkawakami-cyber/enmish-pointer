<?xml version="1.0" encoding="UTF-8"?>
<!-- Enmish Pointer 横ロックアップ（アイコン + ワードマーク） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 84" width="340" height="84" role="img" aria-label="Enmish Pointer">
  <defs>
    <linearGradient id="lp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a3d5c"/>
      <stop offset="1" stop-color="#032841"/>
    </linearGradient>
  </defs>
  <!-- アイコンタイル -->
  <g transform="translate(8,10)">
    <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#lp-bg)"/>
    <circle cx="26" cy="25" r="12.5" fill="none" stroke="#6cbba5" stroke-width="3.6"/>
    <path d="M26 22 L26 49 L33 42 L38.2 53 L42.8 50.8 L37.6 40 L47 39 Z"
          fill="#ffffff" stroke="#032841" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <!-- ワードマーク -->
  <text x="88" y="46" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5" fill="#032841">enmish</text>
  <text x="89" y="68" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4.5" fill="#6cbba5">POINTER</text>
</svg>
