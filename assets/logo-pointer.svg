<?xml version="1.0" encoding="UTF-8"?>
<!-- Enmish Pointer 横ロックアップ（パルスのマーク + ワードマーク） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 84" width="320" height="84" role="img" aria-label="Enmish Pointer">
  <!-- パルス（ミント） -->
  <g transform="translate(42,42)">
    <circle r="26" fill="none" stroke="#34d3a6" stroke-width="5" opacity="0.34"/>
    <circle r="16" fill="none" stroke="#34d3a6" stroke-width="5" opacity="0.68"/>
    <circle r="6.6" fill="#34d3a6"/>
  </g>
  <!-- ワードマーク -->
  <text x="88" y="46" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5" fill="#032841">enmish</text>
  <text x="89" y="68" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4.5" fill="#34d3a6">POINTER</text>
</svg>
